# Build the inference image (x86_64) on every push and pull request, and
# publish it to ghcr.io for `v*` tags (as `<tag>` and `latest`).
#
# Needs (repository settings):
# - secret REAL_PROB_LAM_TOKEN: a fine-grained token with read access to the
#   contents of leifdenby/real-prob-lam (neural-lam). Passed to the build as
#   the `github_token` secret, never as a build arg, and only sent to GitHub
# - variables PACKAGE_URL and PACKAGE_MD5: the inference package zip (e.g.
#   on Zenodo) and its md5
# Without them the build is skipped.
name: Build Container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mlwp-inference-container-clara

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    env:
      HAVE_CONFIG: ${{ secrets.REAL_PROB_LAM_TOKEN != '' && vars.PACKAGE_URL != '' && vars.PACKAGE_MD5 != '' }}

    steps:
      - name: Skip without the token and package configuration
        if: env.HAVE_CONFIG != 'true'
        run: >-
          echo "::notice::REAL_PROB_LAM_TOKEN, PACKAGE_URL or PACKAGE_MD5 not
          set, skipping the image build"

      - name: Check out repository
        if: env.HAVE_CONFIG == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, for the version

      - &free-disk-space
        name: Free disk space (the base image is large)
        if: env.HAVE_CONFIG == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - &install-uv
        name: Install uv
        if: env.HAVE_CONFIG == 'true'
        uses: astral-sh/setup-uv@v6

      - &prepare-context
        name: Prepare the build context
        if: env.HAVE_CONFIG == 'true'
        # The Containerfile always copies LOCAL_ARTIFACT_DIR: an empty
        # directory with ARTIFACT_SOURCE=release
        run: mkdir -p artifact/build/.empty

      - &version
        name: Get the package version from the git tag
        if: env.HAVE_CONFIG == 'true'
        # the build context has no .git, so the Containerfile gets the
        # setuptools-scm version as a build arg
        id: version
        run: |
          version=$(uvx --from setuptools-scm python -m setuptools_scm)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "clara-inference version $version"

      - &buildx
        name: Set up Docker Buildx
        if: env.HAVE_CONFIG == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: env.HAVE_CONFIG == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            ARTIFACT_SOURCE=release
            PACKAGE_URL=${{ vars.PACKAGE_URL }}
            PACKAGE_MD5=${{ vars.PACKAGE_MD5 }}
          secrets: |
            github_token=${{ secrets.REAL_PROB_LAM_TOKEN }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image
    needs: build
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      HAVE_CONFIG: ${{ secrets.REAL_PROB_LAM_TOKEN != '' && vars.PACKAGE_URL != '' && vars.PACKAGE_MD5 != '' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        if: env.HAVE_CONFIG == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, for the version

      - *free-disk-space

      - *prepare-context

      - *install-uv

      - *version

      - *buildx

      - name: Log in to GitHub Container Registry
        if: env.HAVE_CONFIG == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: env.HAVE_CONFIG == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        if: env.HAVE_CONFIG == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            ARTIFACT_SOURCE=release
            PACKAGE_URL=${{ vars.PACKAGE_URL }}
            PACKAGE_MD5=${{ vars.PACKAGE_MD5 }}
          secrets: |
            github_token=${{ secrets.REAL_PROB_LAM_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
