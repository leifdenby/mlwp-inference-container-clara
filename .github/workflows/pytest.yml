# Run the tests in the locked environment (uv.lock)
name: pytest

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for the setuptools-scm version

      - name: Free disk space (torch and its CUDA libraries are large)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen pytest tests
