[project]
name = "clara-inference"
dynamic = ["version"]
description = "Inference for CLARA (CRPS-LAM Rapid Atmospheric ensembles), the CRPS-LAM probabilistic ML limited-area weather model (arXiv:2510.09484), run from DINI and IFS forecasts, and the container image that runs it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Leif Denby", email = "lcd@dmi.dk"},
]
dependencies = [
    "parse>=1.20.2",
    # neural-lam pins dask~=2025.3.0 (and xarray~=2025.3.1, numpy<2) to
    # match the environment CLARA was trained with
    "dask>=2025.3.0",
    "dotenv>=0.9.9",
    "ipdb>=0.13.13",
    "s3fs>=2025.3.2",
    # reading WeatherBench2 ERA5 (artifact building)
    "gcsfs",
    "tqdm>=4.67.1",
    "universal-pathlib>=0.2.6",
    # zarr v2 as used for training: neural-lam writes eval output with a
    # zarr v2 style numcodecs compressor, which zarr v3 rejects
    "zarr>=2.18,<3",
    "ipython>=8.37.0",
    "mllam-data-prep",
    "neural-lam",
    # used directly; versions as resolved for neural-lam / mllam-data-prep
    "cartopy",
    "isodate",
    "loguru",
    "numpy",
    "pyproj",
    "pyyaml",
    "requests",
    "scipy",
    # as in real-prob-lam's `gpu` extra (2.12, the series CLARA's inference
    # was tested with); the container image uses its base image's torch
    # (NB: NVIDIA's aarch64 image has a pre-release, 2.10.0a0+...nv26.01,
    # which is < 2.10)
    "torch>=2.9,<2.13",
    "xarray",
]

[project.scripts]
clara-inference = "clara_inference.run:main"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# the version comes from the git tag (vX.Y.Z); a build without git (the
# container build gets it as IMAGE_VERSION, see the Containerfile) falls
# back to this
fallback_version = "0.0.0+unknown"
# only `v*` tags are versions (e.g. not artifact-* release tags)
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*.*)$"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*"

[tool.isort]
profile = "black"
# as black in .pre-commit-config.yaml (the black profile assumes 88)
line_length = 79
known_first_party = ["clara_inference"]

[tool.uv]
# rebuild the (editable) install when the commit or tags change, so the
# version from setuptools-scm stays current
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]
# Use exactly the mllam-data-prep CLARA was trained with (as locked in
# real-prob-lam): Erik-Wikingsson/mllam-data-prep-real@rect-boundary (mdp
# 0.5.0 based, adds rectangular domain cropping in projection space and
# `lead_time` for derived variables). neural-lam depends on the package by
# name only, this pins it to a commit
override-dependencies = [
    "mllam-data-prep[latlon-domain-crop] @ git+https://github.com/Erik-Wikingsson/mllam-data-prep-real@0589539bdedf942ce66399b418d2f997e3bf4cab",
]

[[tool.uv.index]]
# CUDA 13.0 torch builds (x86_64 and aarch64, e.g. the DGX Spark's GB10).
# The container image uses its base image's torch instead (see Containerfile)
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# CLARA's training code: neural-lam in leifdenby/real-prob-lam (private; git
# authenticates with the developer's credentials, the container build with a
# token build secret), branch prob-model-inference: bf16/single-GPU inference
# fixes, NEURAL_LAM_STRICT_LOAD and NEURAL_LAM_SKIP_TEST_METRICS
neural-lam = { git = "https://github.com/leifdenby/real-prob-lam", rev = "d96b97212c63a42e23419553b78b36bbcd29d1b6", subdirectory = "neural-lam-dev-building-ml-lams" }
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"
