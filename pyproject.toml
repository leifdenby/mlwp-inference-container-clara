[project]
name = "anna-inference"
dynamic = ["version"]
description = "Inference for ANNA, the DANRA ML limited-area weather model (arXiv:2504.09340), run from DINI forecasts, and the container image that runs it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Leif Denby", email = "lcd@dmi.dk"},
    {name = "Kasper Hintz", email = "kah@dmi.dk"},
]
dependencies = [
    "parse>=1.20.2",
    # neural-lam-dev pins dask~=2025.3.0 (and xarray~=2025.3.1, numpy<2) to
    # match the environment the DANRA model was trained with
    "dask>=2025.3.0",
    "dotenv>=0.9.9",
    "ipdb>=0.13.13",
    "s3fs>=2025.3.2",
    "tqdm>=4.67.1",
    "universal-pathlib>=0.2.6",
    # zarr v2 as used for training (2.18.3): neural-lam-dev writes eval output
    # with a zarr v2 style numcodecs compressor, which zarr v3 rejects
    "zarr>=2.18,<3",
    "ipython>=8.37.0",
    "mllam-data-prep",
    "neural-lam",
    # used directly; versions as resolved for neural-lam-dev / mllam-data-prep
    "cartopy",
    "isodate",
    "loguru",
    "numpy",
    "pyproj",
    "pyyaml",
    "requests",
    "scipy",
    "torch",
    "xarray",
]

[project.scripts]
anna-inference = "anna_inference.run:main"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the operational (DINI/IFS) boundary datastore configs
anna_inference = ["boundary/*.yaml"]

[tool.setuptools_scm]
# the version comes from the git tag (vX.Y.Z); a build without git (the
# container build gets it as IMAGE_VERSION, see the Containerfile) falls
# back to this
fallback_version = "0.0.0+unknown"
# only `v*` tags are versions (e.g. not the artifact-* mirror release tags)
tag_regex = "^v(?P<version>\\d+(?:\\.\\d+)*.*)$"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --abbrev=40 --match v[0-9]*"

[tool.isort]
profile = "black"
# as black in .pre-commit-config.yaml (the black profile assumes 88)
line_length = 79
known_first_party = ["anna_inference"]

[tool.uv]
# rebuild the (editable) install when the commit or tags change, so the
# version from setuptools-scm stays current
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]
# Use exactly the mllam-data-prep ANNA was trained with:
# sadamov/mllam-data-prep@building-ml-lams (mdp 0.5.0 based, adds domain
# cropping and `lead_time` for derived variables). neural-lam-dev depends on the
# branch by URL, this pins it to a commit. NB: mllam-data-prep >= 0.7 is not
# compatible with neural-lam-dev for boundaries on regular lat/lon grids
# (latitude/longitude are not kept as per-grid_index coordinates)
override-dependencies = [
    "mllam-data-prep[latlon-domain-crop] @ git+https://github.com/sadamov/mllam-data-prep.git@dd9af481de64cbb18de269ca69a2e773027bd12d",
]

[tool.uv.sources]
# ANNA (gefion-1) was trained with neural-lam-dev@e58e334c (research branch).
# a44d432e (research, 2025-08-22) also includes forecast-format boundary
# forcing and the dependency versions matching the DANRA checkpoint. Later
# research commits add git submodule entries without a .gitmodules url, which
# breaks installing from git (and only change plotting code in neural_lam/)
neural-lam = { git = "https://github.com/joeloskarsson/neural-lam-dev", rev = "a44d432e" }

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"
