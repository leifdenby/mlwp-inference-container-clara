# CLARA model card: the model and its input and output variables.
#
# The single source for MODEL_CARD.md, generated with
#     uv run python -m clara_inference.model_card
# tests/test_model_card.py checks that the variables here are those of the
# training datastore configs (artifact/configs/), in the same order, with the
# training loss weights, and that MODEL_CARD.md is up to date.
#
# Per variable:
#   name           as in the datastores (and output zarrs, for the state)
#   long_name      a description
#   units          as stored (UDUNITS)
#   levels         pressure levels (hPa) or height above ground (m); none for
#                  single levels
#   standard_name  the CF standard name (table version below), or null when
#                  none exists
#   cf             yes: the standard name and units describe the variable
#                  as stored (in the output files for the state, in the
#                  datastores for the other groups)
#                  partial: a standard name applies, but something about the
#                  variable as stored differs (see cf_note)
#                  no: no CF standard name exists
#   cf_note        why partial/no, or where the sources' own metadata differ
#   source         where the operational inputs come from and how they are
#                  converted (the state: DINI; boundary: IFS open data)
#   notes          anything else a user needs to know
schema_version: 0.1.0
cf_standard_name_table: 95

model:
  name: CLARA
  full_name: CRPS-LAM Rapid Atmospheric ensembles
  summary: >-
    A probabilistic limited-area model for the DANRA domain (Denmark and
    surroundings, 2.5 km). Each ensemble member is a rollout of the CRPS-LAM
    model in 3 h steps from two DINI initial states, with lateral boundary
    conditions from an IFS forecast. The members differ through noise
    injected into the model, not through perturbed initial states.
  paper:
    title: >-
      CRPS-LAM: Probabilistic Regional Weather Forecasting with Continuous
      Ranked Probability Score
    authors: Erik Larsson, Joel Oskarsson, Tomas Landelius, Fredrik Lindsten
    arxiv: "2510.09484"
  architecture: >-
    the crps model of neural-lam with a graph_unet2 backbone, 251.5 M
    parameters, trained with a CRPS objective (see the paper). This
    checkpoint is the fine-tune with an IFS forecast boundary: 5-member
    ensembles over 12 autoregressive steps, 93 epochs
  training_data:
    interior: DANRA v0.5.0 reanalysis, 3-hourly
    boundary: IFS forecasts, 00/12 UTC cycles, 6-hourly lead times
    period: 2016-01-01 to 2019-10-22
    statistics: >-
      the interior is normalised with DANRA statistics, the IFS boundary
      with ERA5 statistics, both over the training period
  intended_use: >-
    Research and experimental short-range ensemble forecasts over the DANRA
    domain from DINI analyses. Not an operational product: the forecasts
    have not been verified beyond example cases.
  limitations:
    - >-
      The model doesn't keep its outputs within physical ranges: relative
      humidity can be outside [0, 1] and net short-wave radiation negative at
      some grid points. The training config's output clamping isn't applied
      by the crps model. `--clip-to-physical-ranges` clips them in the
      output files (off by default).
    - >-
      The ensemble spread is somewhat smaller than the ensemble-mean error
      against DINI in the example cases.
    - >-
      There are no precipitation, cloud, near-surface humidity, gust,
      visibility or snow variables (see Not available).
    - >-
      The initial states come from DINI, whereas the model was trained on
      DANRA states; differences between the two (e.g. in the radiation
      fields) may affect the first steps.

time:
  step: PT3H
  initial_states: >-
    two DINI states, at the analysis time T and T+3 h (DINI's own 3 h
    forecast)
  outputs: valid times T+6 h to T+duration in 3 h steps
  boundary: >-
    the latest 00/12 UTC IFS cycle at or before T-3 h, with lead times
    every 6 h
  instantaneous: >-
    all fields are instantaneous values at the valid time (no accumulations
    or time means)

ensemble: >-
  `ensemble_member` dimension (0, 1, ...). Members are exchangeable: their
  numbering has no meaning. Default 5 members.

grids:
  interior: >-
    the DANRA grid: Lambert conformal, 2.5 km, 589 x 789 points (CF grid
    mapping `danra_projection` in the output files)
  boundary: >-
    14,858 points of the 0.25 deg regular latitude-longitude grid within
    400 km of the interior, including the points inside the interior

level_types:
  height:
    title: Height levels
    description: at a fixed height above ground (`levels`, in m)
  single:
    title: Single levels
    description: >-
      at the surface, at mean sea level, at the top of the atmosphere or
      without a vertical coordinate
  pressure:
    title: Pressure levels
    description: on pressure levels (`levels`, in hPa)

output_files:
  single_levels.zarr: >-
    the height- and single-level state variables, dims (ensemble_member,
    time, y, x)
  pressure_levels.zarr: >-
    the pressure-level state variables, dims (ensemble_member, time,
    pressure, y, x)
  metadata: >-
    the output variables carry `units` and the grid mapping only; their
    `long_name` and `standard_name` are planned to come from this card

groups:
  state:
    title: Interior state (initial states and forecast)
    description: >-
      The 55 prognostic features on the DANRA grid: the model's inputs at the
      two initial times and its outputs at every valid time. Trained on
      DANRA; operationally the initial states come from DINI, regridded to
      the DANRA grid (bilinear, in DINI's projection).
    variables:
      - name: pres_seasurface
        long_name: air pressure at mean sea level
        units: Pa
        level_type: single
        standard_name: air_pressure_at_mean_sea_level
        cf: "yes"
        source: "DINI pres_seasurface"
        output_file: single_levels.zarr
      - name: t2m
        long_name: air temperature at 2 m
        units: K
        level_type: height
        levels: [2]
        standard_name: air_temperature
        cf: partial
        cf_note: >-
          CF needs a scalar `height` coordinate (2 m), which the output
          files don't have yet
        source: "DINI t2m"
        output_file: single_levels.zarr
      - name: u10m
        long_name: wind component along the DANRA grid x-axis at 10 m
        units: m s-1
        level_type: height
        levels: [10]
        standard_name: x_wind
        cf: partial
        cf_note: >-
          CF needs a scalar `height` coordinate (10 m), which the output
          files don't have yet. DINI labels its (also grid-relative) winds
          eastward_wind, which is wrong
        source: >-
          DINI u10m/v10m, rotated from the DINI grid to the DANRA grid
        notes: >-
          relative to the DANRA Lambert grid, not eastward: rotate with the
          grid's angle to get east/north components
        output_file: single_levels.zarr
      - name: v10m
        long_name: wind component along the DANRA grid y-axis at 10 m
        units: m s-1
        level_type: height
        levels: [10]
        standard_name: y_wind
        cf: partial
        cf_note: >-
          CF needs a scalar `height` coordinate (10 m), which the output
          files don't have yet. DINI labels its (also grid-relative) winds
          northward_wind, which is wrong
        source: >-
          DINI u10m/v10m, rotated from the DINI grid to the DANRA grid
        notes: >-
          relative to the DANRA Lambert grid, not northward
        output_file: single_levels.zarr
      - name: pres0m
        long_name: surface air pressure
        units: Pa
        level_type: single
        standard_name: surface_air_pressure
        cf: "yes"
        cf_note: DANRA labels it air_pressure
        source: "DINI pres0m"
        output_file: single_levels.zarr
      - name: lwavr0m
        long_name: net long-wave radiation flux at the surface
        units: W m-2
        level_type: single
        standard_name: surface_net_downward_longwave_flux
        cf: "yes"
        cf_note: DANRA has no standard name; DINI's long_name says downwelling
        source: "DINI lwavr0m"
        notes: >-
          positive downwards, so mostly negative; close to zero under low
          cloud
        output_file: single_levels.zarr
      - name: swavr0m
        long_name: net short-wave radiation flux at the surface
        units: W m-2
        level_type: single
        standard_name: surface_net_downward_shortwave_flux
        cf: "yes"
        cf_note: >-
          DANRA has no standard name; DINI labels it
          surface_downwelling_shortwave_flux, but it is the same net flux
        source: "DINI swavr0m"
        notes: >-
          positive downwards. Can be negative at night in the forecasts
          (not physical; see limitations)
        physical_range: [0, null]
        output_file: single_levels.zarr
      - name: z
        long_name: geopotential
        units: m2 s-2
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: geopotential
        cf: "yes"
        source: "DINI z"
        output_file: pressure_levels.zarr
      - name: t
        long_name: air temperature
        units: K
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: air_temperature
        cf: "yes"
        source: "DINI t"
        output_file: pressure_levels.zarr
      - name: r
        long_name: relative humidity
        units: "1"
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: relative_humidity
        cf: "yes"
        cf_note: >-
          a fraction (0-1). DANRA's units say %, but its values are
          fractions; DINI's are in %
        source: "DINI r, divided by 100"
        notes: >-
          can be outside [0, 1] in the forecasts (see limitations)
        physical_range: [0, 1]
        output_file: pressure_levels.zarr
      - name: u
        long_name: wind component along the DANRA grid x-axis
        units: m s-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: x_wind
        cf: "yes"
        cf_note: DINI labels its (also grid-relative) winds eastward_wind
        source: "DINI u/v, rotated from the DINI grid to the DANRA grid"
        notes: relative to the DANRA Lambert grid, not eastward
        output_file: pressure_levels.zarr
      - name: v
        long_name: wind component along the DANRA grid y-axis
        units: m s-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: y_wind
        cf: "yes"
        cf_note: DINI labels its (also grid-relative) winds northward_wind
        source: "DINI u/v, rotated from the DINI grid to the DANRA grid"
        notes: relative to the DANRA Lambert grid, not northward
        output_file: pressure_levels.zarr
      - name: tw
        long_name: upward air velocity (geometric vertical velocity)
        units: m s-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: upward_air_velocity
        cf: "yes"
        source: "DINI tw"
        notes: >-
          in m s-1, unlike the IFS boundary's vertical velocity (Pa s-1)
        output_file: pressure_levels.zarr

  interior_forcing:
    title: Interior forcings
    description: >-
      Computed from the valid time (and position) at every step, on the
      DANRA grid.
    variables:
      - name: toa_radiation
        long_name: incoming short-wave radiation at the top of the atmosphere
        units: W m-2
        level_type: single
        standard_name: toa_incoming_shortwave_flux
        cf: "yes"
        source: >-
          computed (mllam-data-prep): solar constant 1366 W m-2 times the
          cosine of the solar zenith angle (0 at night), no atmosphere
      - name: hour_of_day_sin
        long_name: sine of the hour of the day (2 pi * hour / 24, UTC)
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time (UTC)
      - name: hour_of_day_cos
        long_name: cosine of the hour of the day
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time (UTC)
      - name: day_of_year_sin
        long_name: sine of the day of the year (2 pi * day / 366)
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time
      - name: day_of_year_cos
        long_name: cosine of the day of the year
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time

  interior_static:
    title: Interior static fields
    description: From DANRA, shipped in the inference artifact.
    variables:
      - name: lsm
        long_name: land-sea mask (1 land, 0 sea)
        units: "1"
        level_type: single
        standard_name: land_binary_mask
        cf: "yes"
        source: DANRA v0.5.0 (artifact)
      - name: orography
        long_name: surface geopotential
        units: m2 s-2
        level_type: single
        standard_name: surface_geopotential
        cf: "yes"
        cf_note: >-
          despite its name, the surface geopotential (DANRA labels it
          geopotential), not surface_altitude in m
        source: DANRA v0.5.0 (artifact)

  boundary_forcing:
    title: Boundary forcings (IFS)
    description: >-
      The lateral boundary: an IFS forecast on the boundary points (0.25
      deg), with ERA5 names and units, plus the same computed forcings as the
      interior. Normalised with ERA5 statistics. Operationally from ECMWF
      open data (dev-utils/make_ifs_boundary_zarr.py, IFS parameter given in
      the source column).
    variables:
      - name: mean_sea_level_pressure
        long_name: air pressure at mean sea level
        units: Pa
        level_type: single
        standard_name: air_pressure_at_mean_sea_level
        cf: "yes"
        source: IFS msl
      - name: 2m_temperature
        long_name: air temperature at 2 m
        units: K
        level_type: height
        levels: [2]
        standard_name: air_temperature
        cf: "yes"
        source: IFS 2t
      - name: 10m_u_component_of_wind
        long_name: eastward wind at 10 m
        units: m s-1
        level_type: height
        levels: [10]
        standard_name: eastward_wind
        cf: "yes"
        source: IFS 10u
        notes: earth-relative, unlike the interior winds
      - name: 10m_v_component_of_wind
        long_name: northward wind at 10 m
        units: m s-1
        level_type: height
        levels: [10]
        standard_name: northward_wind
        cf: "yes"
        source: IFS 10v
        notes: earth-relative, unlike the interior winds
      - name: surface_pressure
        long_name: surface air pressure
        units: Pa
        level_type: single
        standard_name: surface_air_pressure
        cf: "yes"
        source: IFS sp
      - name: toa_radiation
        long_name: incoming short-wave radiation at the top of the atmosphere
        units: W m-2
        level_type: single
        standard_name: toa_incoming_shortwave_flux
        cf: "yes"
        source: computed at the boundary points (as for the interior)
      - name: hour_of_day_sin
        long_name: sine of the hour of the day
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time (UTC)
      - name: hour_of_day_cos
        long_name: cosine of the hour of the day
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time (UTC)
      - name: day_of_year_sin
        long_name: sine of the day of the year
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time
      - name: day_of_year_cos
        long_name: cosine of the day of the year
        units: "1"
        level_type: single
        standard_name: null
        cf: "no"
        cf_note: a model feature, not a physical quantity
        source: computed from the valid time
      - name: geopotential
        long_name: geopotential
        units: m2 s-2
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: geopotential
        cf: "yes"
        source: IFS gh (geopotential height), multiplied by g = 9.80665 m s-2
      - name: temperature
        long_name: air temperature
        units: K
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: air_temperature
        cf: "yes"
        source: IFS t
      - name: specific_humidity
        long_name: specific humidity
        units: kg kg-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: specific_humidity
        cf: "yes"
        source: IFS q
        notes: the interior has relative humidity instead
      - name: u_component_of_wind
        long_name: eastward wind
        units: m s-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: eastward_wind
        cf: "yes"
        source: IFS u
        notes: earth-relative, unlike the interior winds
      - name: v_component_of_wind
        long_name: northward wind
        units: m s-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: northward_wind
        cf: "yes"
        source: IFS v
        notes: earth-relative, unlike the interior winds
      - name: vertical_velocity
        long_name: vertical velocity in pressure coordinates (omega)
        units: Pa s-1
        level_type: pressure
        levels: [100, 200, 400, 600, 700, 850, 925, 1000]
        standard_name: lagrangian_tendency_of_air_pressure
        cf: "yes"
        source: IFS w
        notes: >-
          positive downwards (increasing pressure), in Pa s-1, unlike the
          interior's tw (m s-1, positive upwards)

  boundary_static:
    title: Boundary static fields (ERA5)
    description: From ERA5 (WeatherBench2), shipped in the inference artifact.
    variables:
      - name: land_sea_mask
        long_name: land area fraction
        units: "1"
        level_type: single
        standard_name: land_area_fraction
        cf: "yes"
        cf_note: >-
          a fraction (0-1), though WeatherBench2 labels it land_binary_mask
        source: ERA5 (WeatherBench2, artifact)
      - name: geopotential_at_surface
        long_name: surface geopotential
        units: m2 s-2
        level_type: single
        standard_name: surface_geopotential
        cf: "yes"
        source: ERA5 (WeatherBench2, artifact)

not_available:
  - name: precipitation
    note: no precipitation of any kind
  - name: cloud cover
    note: >-
      no cloud variables; relative humidity on pressure levels and the net
      long-wave flux at the surface are rough proxies
  - name: near-surface humidity
    note: no 2 m humidity or dew point; the lowest humidity is r at 1000 hPa
  - name: wind gusts
    note: only mean 10 m winds
  - name: visibility, fog
    note: none
  - name: snow
    note: no snow depth or snowfall
  - name: top-of-atmosphere outgoing radiation
    note: the radiation fluxes are at the surface only
  - name: skin or soil temperature
    note: none
